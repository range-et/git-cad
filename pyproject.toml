[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-cad"
version = "0.1.0"
description = "Local USD snapshot history, materials, and assembly manager"
requires-python = ">=3.12,<3.14"
license = {file = "LICENSE"}
dependencies = [
  "rhino3dm>=8,<9", "usd-core>=25,<28", "numpy>=1.26", "pydantic>=2,<3", "typer>=0.15,<1",
  "PySide6>=6.7,<7", "pyvista>=0.45,<0.50", "pyvistaqt>=0.11,<0.14",
]
[project.optional-dependencies]
mcp = ["mcp>=1,<2"]
dev = [
    "pytest>=8",
    "pillow>=10",
    "hypothesis>=6,<7",
    "syrupy>=4,<6",
    "ruff>=0.11,<1",
    "mypy>=1,<2",
    "pytest-cov>=6,<8",
    "mutmut>=3,<4",
]

[project.urls]
Repository = "https://github.com/range-et/git-cad"

[project.scripts]
git-cad = "cadgit.cli:main"
cad-git = "cadgit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cadgit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
include = ["src/cadgit/compatibility.py", "src/cadgit/errors.py", "tests/conftest.py", "tests/test_verification_*.py", "scripts/check_mutations.py", "scripts/check_coverage.py", "scripts/mutation_campaign.py", "scripts/mutation_probe.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "I"]

[tool.mypy]
files = ["src/cadgit/compatibility.py", "src/cadgit/errors.py"]
strict = true

[tool.mutmut]
source_paths = ["src/cadgit"]
only_mutate = ["src/cadgit/compatibility.py"]
pytest_add_cli_args_test_selection = ["tests/test_verification_compatibility.py"]
pytest_add_cli_args = ["-x", "-q", "--hypothesis-profile=ci"]
